name: Release

on:
  push:
    tags:
      - 'v*'
  # Lets auto-tag-release.yml invoke this deterministically after merging a
  # dev -> main PR: a tag pushed with the default GITHUB_TOKEN does NOT trigger
  # other workflow runs (a documented GitHub Actions anti-recursion rule), so
  # relying on `push: tags` alone would silently never fire in that path.
  workflow_call:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.10.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  resolve:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate before releasing
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=1 go test -race ./internal/server

  docker:
    name: Build and push multi-arch image to GHCR
    needs: [resolve, validate]
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - name: Compute build metadata
        id: build_meta
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags produced for a release tag v1.2.3: 1.2.3, 1.2, latest.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        env:
          # Disables buildx's GitHub Actions build-summary/record-archive
          # upload. That upload uses the Actions cache API, which issues a
          # read-only token for pull_request-triggered runs (a GitHub-side
          # security policy no `permissions:` block can override) — this
          # workflow can run that way via auto-tag-release.yml's
          # pull_request trigger, where the attempt always fails with
          # "Cache reservation failed: cache write denied: token has no
          # writable scopes". Non-fatal either way (the image build/push
          # itself still succeeds), but disabled outright since the summary
          # can never actually be produced on that trigger.
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.TAG }}
            COMMIT=${{ steps.build_meta.outputs.commit }}
            BUILD_DATE=${{ steps.build_meta.outputs.date }}

  binaries:
    name: Cross-compile release binaries, SBOM, and GitHub Release
    needs: [resolve, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build-all VERSION=${{ env.TAG }}
      - run: make sbom VERSION=${{ env.TAG }}
      - name: Archive each platform's binaries
        run: |
          cd dist
          for platform_dir in */; do
            name="${platform_dir%/}"
            tar czf "../locaql-${TAG}-${name}.tar.gz" -C "$name" .
          done
      - name: Create or refresh GitHub Release with binaries and SBOM attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" \
              --clobber \
              locaql-${TAG}-*.tar.gz \
              dist/sbom.json
          else
            gh release create "${TAG}" \
              --title "${TAG}" \
              --generate-notes \
              locaql-${TAG}-*.tar.gz \
              dist/sbom.json
          fi
