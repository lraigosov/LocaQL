name: CLA Assistant

# Requires one-time setup before this actually enforces anything:
#   1. Create a GitHub Personal Access Token (classic, "repo" scope) belonging
#      to an account with write access to this repo (or a dedicated bot
#      account) — used to record signatures, since the default GITHUB_TOKEN
#      cannot write outside the triggering workflow's own permissions.
#   2. Add it as a repository secret named PERSONAL_ACCESS_TOKEN
#      (Settings -> Secrets and variables -> Actions).
#   3. Decide where signatures are stored (path-to-signatures below defaults
#      to a JSON file in this same repo on a dedicated orphan branch,
#      cla-signatures — create that branch, e.g. `git switch --orphan
#      cla-signatures && git commit --allow-empty -m init && git push -u
#      origin cla-signatures`).
# Until that setup is done, the check below skips cleanly (rather than
# failing red on every single PR, including the owner's own) — the "skipped"
# step-summary line is the signal the setup above is still pending, not a
# bug in this workflow.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether PERSONAL_ACCESS_TOKEN setup (see comment above) is done yet
        id: setup-check
        env:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: echo "configured=${{ env.PERSONAL_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: CLA Assistant
        if: steps.setup-check.outputs.configured == 'true' && (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' || github.event_name == 'pull_request_target') && !github.event.pull_request.merged
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/lraigosov/LocaQL/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: lraigosov,github-actions[bot],dependabot[bot]
          remote-organization-name: lraigosov
          remote-repository-name: LocaQL
