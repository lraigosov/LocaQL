name: Prepare Release in dev PR

# A regular promotion is feature/* -> dev -> main. When a same-repository work
# branch opens or updates its PR to dev, this workflow turns the single
# [Unreleased] section into the next dated SemVer section and commits that
# bookkeeping back to the same work branch. dev stays protected, and the later
# dev -> main PR contains both product changes and final release notes. A push
# made with GITHUB_TOKEN does not emit another pull_request event, preventing a
# preparation loop without requiring a release/* branch.
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [dev]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: prepare-release-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Detect version and date CHANGELOG in work branch
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Detect release bump and guard the release state
        id: release
        shell: bash
        run: |
          set -euo pipefail

          unreleased_count=$(grep -c '^## \[Unreleased\]$' CHANGELOG.md || true)
          if [ "$unreleased_count" -ne 1 ]; then
            echo "CHANGELOG.md must contain exactly one ## [Unreleased] section; found $unreleased_count." >&2
            exit 1
          fi

          section=$(awk '/^## \[Unreleased\]$/{found=1; next} /^## \[/{if (found) exit} found {print}' CHANGELOG.md)
          if [ -z "$(printf '%s' "$section" | tr -d '[:space:]')" ]; then
            echo "No unreleased changes to prepare."
            echo "bump=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          latest_version="${latest_tag#v}"
          latest_version="${latest_version:-0.0.0}"
          first_version=$(sed -nE 's/^## \[([0-9]+\.[0-9]+\.[0-9]+)\] - .*/\1/p' CHANGELOG.md | head -1)

          # There may only be one promotion in flight. Without this guard, a
          # second feature merge before dev reaches main could create the same
          # version twice because the first prepared version is not tagged yet.
          if [ -n "$first_version" ] && [ "$first_version" != "$latest_version" ] && ! git show-ref --verify --quiet "refs/tags/v${first_version}"; then
            echo "CHANGELOG.md already contains pending release v${first_version}, while the latest tag is v${latest_version}." >&2
            echo "Promote dev to main before adding another release batch." >&2
            exit 1
          fi

          if printf '%s\n' "$section" | grep -qE '^### Removed|BREAKING'; then
            bump=major
          elif printf '%s\n' "$section" | grep -qE '^### Added'; then
            bump=minor
          else
            bump=patch
          fi

          IFS='.' read -r major minor patch <<< "$latest_version"
          case "$bump" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="${major}.$((minor + 1)).0" ;;
            patch) version="${major}.${minor}.$((patch + 1))" ;;
          esac

          echo "Latest tag: v${latest_version}; detected bump: ${bump}; preparing: v${version}."
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Date the Unreleased section
        if: steps.release.outputs.bump != 'none'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          today=$(date -u +%Y-%m-%d)
          awk -v version="$VERSION" -v today="$today" '
            /^## \[Unreleased\]$/ && !prepared {
              print
              print ""
              print "## [" version "] - " today
              prepared=1
              next
            }
            { print }
          ' CHANGELOG.md > CHANGELOG.md.next
          mv CHANGELOG.md.next CHANGELOG.md

      - name: Commit the prepared release to the work branch
        if: steps.release.outputs.bump != 'none'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: prepare release v${VERSION}"
          # A concurrent human push makes this fail safely as non-fast-forward;
          # that newer synchronize event starts a fresh preparation run.
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Write release summary
        if: steps.release.outputs.bump != 'none'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          BUMP: ${{ steps.release.outputs.bump }}
        shell: bash
        run: |
          {
            echo "## Release prepared"
            echo
            echo "- Version: \`v${VERSION}\`"
            echo "- SemVer bump: \`${BUMP}\`"
            echo "- Next step: review and merge this PR into \`dev\`, then open \`dev -> main\`."
          } >> "$GITHUB_STEP_SUMMARY"
