      - unit/server/dataset_delete_table_count_excludes_expired_tables
    reason: partial update for friendlyName, location, labels and defaultTableExpirationMs is supported; defaultTableExpirationMs is stored and round-tripped (accepts both string and number input, rendered as a string per the BigQuery int64-as-string convention) and now enforced — every table created without an explicit expirationTime inherits an absolute expiration computed from the dataset's default at creation time via a swappable clock (tableService.now, real time.Now in production, overridable in tests), and any table access (get/list/tabledata/dataset-empty-check) lazily purges an expired table the first time it is touched rather than running a background sweep goroutine. This is a narrowly-scoped clock for table expiration specifically, not the general injectable-clock/observability infrastructure envisioned in the master plan's Fase quince (logging, time travel, sessions still use real wall-clock time directly)
  rest.jobs.query:
    status: partial
    fidelity: high
    tests:
      - unit/server/jobs_sync_query
      - unit/server/jobs_executor_type_and_statistics
      - unit/server/jobs_sync_query_supports_information_schema_parameters_with_real_data
      - unit/server/real_sql_engine_where_projection_and_order_by
      - unit/server/real_sql_engine_group_by_aggregate
      - unit/server/real_sql_engine_join_across_tables
      - unit/server/real_sql_engine_limit
      - unit/server/real_sql_engine_invalid_query_fails_explicitly_instead_of_fabricating_rows
      - unit/server/real_sql_engine_missing_table_fails_explicitly
    reason: "async jobs.insert, sync jobs.query and projects.queries all funnel into a real GoogleSQL engine (github.com/goccy/googlesqlite, a pure-Go database/sql driver that parses/analyzes real GoogleSQL and executes against an in-memory SQLite backend — no cgo) as of Sesión 73, replacing the previous regex-matched full-table-dump plus a hardcoded fabricated fallback for anything else. Every table a query references (via FROM/JOIN, extracted with a regex over the query text — see internal/server/sql_engine.go:referencedTables) is materialized into a fresh in-memory instance per query (one SQL schema per dataset, one table per BigQuery table, rows converted from the stored string-per-cell representation to typed values), so WHERE, column projection, JOIN, aggregation (COUNT/SUM/etc. with GROUP BY), ORDER BY and LIMIT are real GoogleSQL semantics now, not simulated — verified with dedicated tests for each. INFORMATION_SCHEMA.X queries are still handled by the separate dedicated builders (see sql.information_schema.priority), since those reflect LocaQL's own catalog metadata rather than user table data. A genuinely invalid query or a reference to a nonexistent table now fails explicitly (a real parser/analyzer error, or 'table not found') instead of returning a fabricated 200. Marked partial, not supported, because of real remaining gaps: a 3-part project.dataset.table reference only resolves when the leading component matches the request's own projectID (cross-project queries are rejected rather than silently misresolved, since the engine has no project-level concept — only dataset-as-schema); result columns of nested STRUCT/ARRAY type report the engine's raw type name rather than BigQuery's RECORD/REPEATED schema shape (see KNOWN-DIVERGENCES.md); DML/DDL executed through a query job (INSERT/UPDATE/DELETE/CREATE TABLE AS SELECT) is not wired to LocaQL's catalog — only SELECT is routed through the real engine, since table mutation still goes through the existing REST job executors (load/copy/extract) by design; and there is no query-plan/cost estimation, so totalSlotMs/dry-run byte estimates remain synthetic as already declared"
  rest.datasets.list.pagination:
    status: supported
    fidelity: medium
    tests:
