  emulator.health:
    status: supported
    fidelity: high
    tests:
      - conformance/foundation/emulator_health
      - unit/server/health_and_readiness_include_subsystem_diagnostics
    reason: "As of Sesión 80, the response includes a subsystems object (jobs run-queue/storage-write-queue depth+capacity, resource-lock count, session submitted/completed/failed job counters, active session count) — real, live diagnostic detail (see emulator.observability), not a fabricated health score. There is no failure condition modeled anywhere in this emulator that would ever flip status away from ok, since nothing here has a real degraded state to report yet"
