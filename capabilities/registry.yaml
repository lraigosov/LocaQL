      - unit/server/tables_patch_expiration_time_round_trip
      - unit/server/tables_patch_schema_evolution_adds_nullable_column
      - unit/server/tables_patch_schema_evolution_rejects_removing_column
      - unit/server/tables_patch_schema_evolution_allows_relaxing_required_to_nullable
      - unit/server/tables_patch_schema_evolution_rejects_tightening_nullable_to_required
    reason: "tables.patch accepts a schema field (Sesión 76) that evolves the existing schema rather than replacing it blindly: appending new columns (which must be NULLABLE, since existing rows have no value for them) and relaxing an existing column from REQUIRED to NULLABLE are allowed; removing a column, renaming/reordering one, changing its type, or tightening NULLABLE to REQUIRED are all rejected explicitly with a 400 rather than silently applied or ignored — validated in the REST handler (validateSchemaEvolution) before calling the service layer"
  rest.tables.update:
    status: supported
    fidelity: medium
    tests:
      - unit/server/tables_update
  rest.tables.external_data_configuration:
    status: partial
    fidelity: medium
    tests:
      - unit/server/external_table_insert_requires_source_uris
      - unit/server/external_table_insert_requires_source_format
      - unit/server/external_table_insert_requires_schema
      - unit/server/external_table_insert_renders_type_and_config
      - unit/server/external_table_query_reflects_live_file_contents
      - unit/server/external_table_tabledata_list_reads_file
      - unit/server/external_table_unreadable_source_fails_query_explicitly
      - unit/server/external_table_information_schema_tables_marks_type_external
      - unit/server/external_table_copy_job_materializes_into_destination
    reason: "tables.insert accepts externalDataConfiguration (sourceUris/sourceFormat/fieldDelimiter/skipLeadingRows, mirroring configuration.load's flat field layout instead of real BigQuery's nested csvOptions) with an explicit schema.fields required (no autodetect); nothing is materialized at creation time — every consumer of real row data (query execution, tabledata.list, copy/extract job sources, INFORMATION_SCHEMA.PARTITIONS row counts) re-reads sourceUris fresh through a single resolveTableRows choke point, so external tables always reflect current file contents. An unreadable source fails the request/job explicitly instead of silently falling back to empty or simulated data. Supported sourceFormat values are the same four as load/extract (NEWLINE_DELIMITED_JSON/CSV/AVRO/PARQUET); ORC and other formats, patching externalDataConfiguration after creation, autodetect, Hive partitioning and compression options are not supported"
  rest.tables.views:
    status: supported
    fidelity: medium
    tests:
      - unit/server/view_insert_derives_schema_and_type
      - unit/server/view_query_reflects_live_underlying_table_data
      - unit/server/view_chained_on_another_view_resolves_recursively
      - unit/server/materialized_view_insert_and_information_schema
      - unit/server/view_insert_rejects_invalid_query_explicitly
      - unit/server/view_insert_rejects_self_reference
      - unit/server/view_insert_rejects_both_view_and_materialized_view
    reason: "tables.insert accepts view.query or materializedView.query (mutually exclusive with each other and with externalDataConfiguration) as of Sesión 75, now that a real query engine exists to back them (see rest.jobs.query): the query is executed once at creation time via the real engine both to validate it (an invalid query or a reference to a nonexistent table fails the insert explicitly with a 400, the same way real BigQuery validates a view's SQL at creation) and to derive schema.fields, since a view's schema is inferred rather than user-supplied. Data is never materialized into the view's own tableRecord.Rows: every access (query execution via FROM/JOIN, tabledata.list, INFORMATION_SCHEMA.PARTITIONS row counts) re-executes the stored query fresh through resolveTableRowsVisiting, so a view always reflects the current state of whatever it selects from — including chained views (a view selecting from another view resolves recursively), guarded by a visiting-set cycle check that fails a self-referencing or circular view chain explicitly rather than recursing forever. A self-referencing view cannot actually be constructed today since validation happens before the view exists in the catalog; the cycle guard exists for when patch-based redefinition is added. MATERIALIZED_VIEW is accepted and rendered with its own type/field, but real BigQuery's periodic background refresh is not modeled — a materialized view is recomputed live on every access exactly like a plain view, a declared simplification rather than a faked cache. tables.patch/update do not support redefining an existing view's query; INFORMATION_SCHEMA.VIEWS/MATERIALIZED_VIEWS/TABLES.table_type reflect real view resources now (see sql.information_schema.priority)"
  rest.tables.nested_schema:
    status: partial
    fidelity: medium
    tests:
      - unit/server/nested_record_schema_insert_and_table_resource_renders_mode_and_fields
      - unit/server/nested_record_load_query_and_tabledata_round_trip
      - unit/server/nested_record_extract_to_ndjson_round_trip
      - unit/server/repeated_scalar_load_query_and_tabledata_round_trip
      - unit/server/repeated_record_array_of_struct_round_trip
      - unit/server/csv_load_rejects_nested_schema_fields_explicitly
    reason: "tableField gained mode (NULLABLE/REQUIRED/REPEATED) and fields (nested schema, for RECORD/STRUCT) as of Sesión 76, with real REST tabledata.list/query-result rendering: a RECORD cell renders as BigQuery's actual nested {\"v\": {\"f\": [...]}} row shape and a REPEATED cell as [{\"v\": ...}, ...], not a JSON-encoded string. NEWLINE_DELIMITED_JSON is the only format with real nested load/extract support (JSON is naturally recursive; the existing scalarValueToString/stringToJSONValue conversion functions already handled arbitrary nested values via their JSON-encode fallback before this even shipped) — CSV, AVRO and PARQUET explicitly reject RECORD/REPEATED schema fields (rejectNestedFields) rather than silently flattening or corrupting them; CSV never will support them (matching real BigQuery), Avro/Parquet could in principle but that is deferred. The real query engine (see rest.jobs.query) materializes and returns nested columns for real: CREATE TABLE emits STRUCT<...>/ARRAY<...> column types, and every scalar leaf of a RECORD/REPEATED value is bound via an explicit CAST(? AS type) inside a literal STRUCT(...)/[...] SQL expression rather than a single bound Go map/slice parameter — verified empirically (a discardable spike run 100 times) that a bare ? placeholder inside an array/struct literal is typed by the engine's analyzer before the bound value is known and silently defaults to INT64, corrupting or rejecting any other type; explicit CAST fixed this with 0/100 mismatches across repeated trials. tables.patch supports schema evolution (see rest.tables.patch) but not changing a column's nested Fields shape once created"
  rest.fake_gcs.json_api:
    status: partial
    fidelity: medium
    tests:
      - unit/server/gcs_buckets_insert_and_list
      - unit/server/gcs_object_upload_get_download_delete
      - unit/server/gcs_object_name_with_slashes_acts_as_pseudo_directory
      - unit/server/gcs_list_objects_with_prefix
      - unit/server/gcs_and_load_extract_gs_uris_interoperate
      - unit/server/gcs_requires_fake_gcs_root_configured
      - unit/server/gcs_upload_rejects_unsupported_upload_type
    reason: "a minimal, real-contract-compatible subset of the Google Cloud Storage JSON API is exposed on the same host:port as the rest of this server (/storage/v1/b and /upload/storage/v1/b), backed by LOCAQL_FAKE_GCS_ROOT using the same bucket/object path-join convention as resolveFakeGCSPath (bigquery.go), so it interoperates with gs:// sourceUris/destinationUris in load/extract/external tables — verified with a test that uploads via this API and loads the same object via a gs:// job. Implemented: buckets.insert/list/get; objects.insert via both media (uploadType=media, data-only body) and multipart (uploadType=multipart, multipart/related body) upload variants, objects.get (metadata and ?alt=media download), objects.list (with optional prefix filter), objects.delete. Verified against the real cloud.google.com/go/storage client via STORAGE_EMULATOR_HOST, not just this project's own tests: bucket create and object upload work as-is, and that run is what proved multipart had to be implemented — the official client's ObjectHandle.NewWriter does not default to media. object.NewReader (download) failed in that same run, but the request never reached this server: the official client has an open, P1-tagged upstream bug where NewReader ignores STORAGE_EMULATOR_HOST/endpoint overrides and calls real GCS instead (googleapis/google-cloud-go#1619), unrelated to this server's correctness — the download/list/delete paths are instead verified directly via this project's own HTTP-level test suite. Not implemented, matching real fields/paths rather than inventing partial ones: resumable uploads (explicit 501), IAM/ACLs, object versioning/generations, lifecycle rules, notifications, signed URLs"
