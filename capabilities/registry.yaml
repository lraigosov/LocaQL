      - unit/server/load_job_statistics_nest_under_job_type
    reason: "renderTableResource never set numRows/numBytes at all, for any table — Table.num_rows/num_bytes on the official client always read None regardless of whether a load job had actually populated the table, found while integrating a real external project against this emulator. Both are now populated from the table's real in-memory row count/estimated byte size for managed tables; external tables and views still omit them entirely (matching real BigQuery, since neither materializes rows into storage the way a plain TABLE does)."
  rest.tables.insert:
    status: supported
    fidelity: medium
    tests:
      - unit/server/tables_insert
      - unit/server/tables_explicit_expiration_time_overrides_dataset_default
  rest.tables.delete:
    status: supported
    fidelity: medium
