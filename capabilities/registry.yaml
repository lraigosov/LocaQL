      - unit/server/information_schema_priority_partitions
      - unit/server/jobs_sync_query_supports_information_schema_parameters_with_real_data
      - unit/server/materialized_view_insert_and_information_schema
    reason: SCHEMATA, SCHEMATA_OPTIONS, TABLES, COLUMNS, TABLE_OPTIONS, JOBS, JOBS_BY_PROJECT, JOBS_BY_USER, PARTITIONS, ROUTINES, PARAMETERS, MODELS, VIEWS and MATERIALIZED_VIEWS query emulation is backed by the live in-memory catalog. JOBS_BY_USER scopes to the UserEmail of the job running the JOBS_BY_USER query itself (the only real "calling user" available; the emulator is anonymous-only and has no broader auth model), returning zero rows rather than all jobs when that job has no UserEmail. PARAMETERS lists each routine's arguments (ordinal_position/parameter_name/data_type) with parameter_mode always "IN", since there is no execution engine to observe a real OUT/INOUT distinction for procedures. VIEWS and MATERIALIZED_VIEWS (Sesión 75) list real view resources (view_definition is the actual stored query) now that tables.insert can create them (see rest.tables.views); TABLES.table_type correspondingly reports VIEW/MATERIALIZED VIEW instead of BASE TABLE for those. SESSIONS is not implemented. None of these builders support column projection yet — a SELECT with an explicit column list still returns every column of the builder's fixed schema, a pre-existing limitation unrelated to views (see KNOWN-DIVERGENCES.md); broader semantic parity is still pending
