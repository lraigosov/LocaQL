  rest.jobs.executors.query_load_extract_copy:
    status: partial
    fidelity: medium
    tests:
      - unit/server/jobs_executor_type_and_statistics
      - unit/server/jobs_copy_real_destination_data
      - unit/server/extract_job_compression_shrinks_avro_and_parquet_output
      - unit/server/extract_job_compression_shrinks_gzipped_csv
      - unit/server/extract_job_rejects_unsupported_compression_for_format
      - unit/server/load_job_round_trips_gzip_compressed_csv_source_rows
      - unit/server/load_job_rejects_compression_for_avro_and_parquet_source_format
      - unit/server/extract_job_splits_into_multiple_shards_when_over_threshold
      - unit/server/extract_job_rejects_multi_shard_result_without_wildcard_uri
      - unit/server/extract_job_rejects_multi_shard_result_with_multiple_literal_uris
      - unit/server/load_job_statistics_nest_under_job_type
    reason: query jobs resolve against the live in-memory catalog and report real outputRows/processedBytes (totalSlotMs stays a synthetic constant by design, since real slot/reservation timing is a declared non-goal); copy jobs materialize destination rows; load jobs materialize destination table schema and, when sourceUris are given, ingest real rows from NEWLINE_DELIMITED_JSON, CSV, AVRO or PARQUET (sourceFormat-dispatched, with fieldDelimiter/skipLeadingRows for CSV); extract jobs read a real source table and write destinationUris in the same four formats (fieldDelimiter/printHeader for CSV). Avro uses github.com/linkedin/goavro/v2 (Apache 2.0); Parquet uses github.com/parquet-go/parquet-go (Apache 2.0, requires Go 1.24.9+, bumped from 1.22 explicitly for this). sourceUris/destinationUris are local file paths by default; gs:// URIs resolve onto a local directory only when LOCAQL_FAKE_GCS_ROOT is set (a LocaQL-only local-disk mapping, not a GCS-compatible API), otherwise gs:// is rejected explicitly. Multi-wildcard destinationUris and ORC are rejected explicitly, not silently ignored. configuration.load.compression and configuration.extract.compression are now wired — GZIP for CSV/NDJSON (both directions); on extract only, SNAPPY/DEFLATE for AVRO (goavro OCF codecs) and SNAPPY/GZIP for PARQUET (parquet-go codecs), verified by comparing extracted file sizes with/without compression rather than just checking the file decodes (both libraries decode any codec transparently regardless of what was requested, so decoding alone wouldn't prove the codec was honored). AVRO/PARQUET on load never accept a non-NONE compression value, since their codec is embedded in the file and auto-detected on read, so the field would be a silent no-op there and is rejected explicitly instead. External tables' externalDataConfiguration does not expose compression yet. A single '*' wildcard in destinationUris now resolves to a real multi-shard writer instead of always forcing a single 000000000000 file — by default (LOCAQL_EXTRACT_SHARD_MAX_BYTES unset) every row still lands in one shard, unchanged; once that env var is set, exceeding it splits the encoded result across sequentially-numbered shard files, each independently valid per format (CSV repeats its header per shard when printHeader is set). A result that needs splitting but has no wildcard, or more than one destinationUris entry, fails explicitly rather than silently picking one destination or duplicating shards. There is still no size-based split for the LOCAQL_FAKE_GCS_ROOT/gs:// case beyond the same local-path mapping, and the threshold is local-only tuning, not BigQuery's real ~1GB-per-file behavior. A load job's row/byte counts used to be written only flat, under statistics.outputRows/processedBytes — real BigQuery (and the official client's LoadJob.output_rows/output_bytes properties specifically) expects them additionally nested under statistics.load.outputRows/outputBytes; a client polling its own load job to completion always saw output_rows as None despite the count being computed correctly server-side. Now nested for load jobs specifically (query/copy/extract keep the flat-only shape for now, since this fix was scoped to the verified load-job gap, not a full audit of every job type's statistics shape).
  rest.jobs.load_table_from_file:
    status: supported
    fidelity: medium
    tests:
      - unit/server/bigquery_multipart_upload_ingests_file_data
      - unit/server/bigquery_resumable_upload_accepts_chunks_and_ingests_file_data
      - unit/server/bigquery_resumable_upload_accepts_empty_file
      - unit/server/bigquery_resumable_upload_rejects_non_contiguous_chunk
      - e2e/python/official_client_load_table_from_file_multipart_and_resumable
    reason: "Added after the comparative report identified that the official Python Client.load_table_from_file endpoint returned 404: LocaQL now exposes /upload/bigquery/v2/projects/{project}/jobs for both uploadType=multipart and uploadType=resumable. Multipart parses the real multipart/related metadata-plus-media body and returns the 200 status required by google-resumable-media. Resumable upload implements 200 initiation with Location, sequential Content-Range chunks, 308 plus Range progress acknowledgement, duplicate committed-chunk acknowledgement, offset conflict rejection, zero-byte completion, and a cached final response for retries. Both paths submit the bytes to the existing real load executor and therefore share CSV/NDJSON/Avro/Parquet and compression semantics with sourceUris instead of maintaining a second parser. Job resources now render configuration.load and statistics.load, so google-cloud-bigquery 3.42.3 constructs a real LoadJob, job.result() completes, and output_rows reports the materialized rows; the pinned official SDK smoke test covers both size-known multipart and size=None resumable modes and is wired into CI. Official int64-as-string encoding for skipLeadingRows was found by this E2E and is accepted for both load jobs and external tables. Fidelity is medium because schema.fields is still required (no autodetect), incomplete resumable sessions are memory-buffered/process-local with a one-hour idle TTL rather than durable or disk-spooled, and the official-client matrix currently covers Python only. Uploaded media is excluded from job persistence and released from completed jobs/sessions immediately."
  rest.routines.crud:
    status: supported
    fidelity: medium
    tests:
      - unit/server/routines_insert_get_patch_delete_lifecycle
      - unit/server/routines_insert_requires_definition_body
      - unit/server/routines_require_existing_dataset
      - unit/server/routines_insert_and_patch_round_trip_arguments
    reason: "insert/get/list/patch/delete for bigquery/v2/.../routines are metadata-only: there is no SQL execution engine behind routines, so definitionBody/routineType/language round-trip without ever being executed. Routines also accept an optional arguments array ([{name, dataType}]), stored and returned as-is and surfaced via INFORMATION_SCHEMA.PARAMETERS; dataType is a flat scalar type name rather than real BigQuery's nested StandardSqlDataType, the same flat-shape simplification already used for schema.fields/externalDataConfiguration elsewhere. A patch that omits arguments leaves existing ones untouched; a patch that includes arguments replaces them wholesale"
