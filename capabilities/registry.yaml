  rest.tabledata.list.pagination:
    status: supported
    fidelity: medium
    tests:
      - conformance/pagination/rest_tabledata_list_pagination
      - unit/server/tabledata_list_real_bigquery_path
      - unit/server/tabledata_list_real_bigquery_path_rejects_non_get
      - unit/server/tabledata_list_real_bigquery_path_unknown_table_404s
      - unit/server/tabledata_list_final_page_omits_page_token
    reason: "Real BigQuery's tabledata.list lives at .../datasets/{datasetId}/tables/{tableId}/data (6 path segments), which is what google-cloud-bigquery's list_rows() actually requests — the router previously only recognized a made-up .../tabledata/{datasetId}/{tableId}/data shape that no official client ever calls (only this project's own tests and bundled UI did), so every real client request 404'd even though the same table's schema was reachable fine via tables.get. Fixed by handling the real path shape explicitly in dispatchDatasetSubResource's tables case; the old shape stays working as an internal alias rather than being removed, since the UI and its own test still use it. Separately, the response always included a pageToken key even on the final page (echoing the request's own start index) — the official client's row iterator for this endpoint specifically checks the mere presence of a pageToken key (not nextPageToken) to decide whether to fetch another page, so list_rows() looped forever re-requesting the same last page instead of ever returning. pageToken and nextPageToken are now both omitted once end reaches len(rows). Both bugs were found together while integrating a real external project against this emulator, not from this project's own test suite, which is why neither one had a reason field or a real-path test before this."
  sql.types.core_scalars:
    status: partial
    fidelity: medium
    tests:
      - unit/server/numeric_preserves_exact_decimal_precision_through_load_query_extract
      - unit/server/bignumeric_preserves_full_precision
      - unit/server/date_datetime_time_timestamp_round_trip_through_tabledata_unchanged
      - unit/server/date_column_to_column_comparison_works_correctly
      - unit/server/date_string_literal_parses_correctly_regardless_of_host_timezone
    reason: "NUMERIC and BIGNUMERIC (Sesión 77) are now real column types in the query engine (added to realSQLScalarTypes) rather than falling back to STRING: exact decimal precision is preserved end to end (verified with a 38-digit BIGNUMERIC value round-tripping unchanged) and real decimal arithmetic works (0.1 + 0.2 = exactly 0.3 through the engine, unlike FLOAT64's binary rounding error). DATE/DATETIME/TIME/TIMESTAMP were already accepted; verified they round-trip unchanged through tabledata.list (never touches the query engine for a plain table) and that comparing two real DATE columns to each other works correctly through the engine. **Fixed in Sesión 85, re-characterized from the original Sesión 77 finding:** constructing a DATE value from a string inside query text (`DATE 'YYYY-MM-DD'` literal syntax or `CAST('YYYY-MM-DD' AS DATE)`) used to silently produce a date one calendar day earlier than the string says — discovered while wiring up CI that this only reproduced on a host configured with a negative UTC offset (verified against this project's own America/Bogota, UTC-5 dev environment) and never on a UTC-configured CI runner; root-caused to the process's ambient time.Local rather than a fixed engine defect, and fixed by forcing time.Local = time.UTC at process start (internal/server/server.go init()). Confirmed NOT to affect DATETIME/TIMESTAMP/TIME literals, CURRENT_DATE(), DATE(<timestamp>) extraction, or DATE column-to-column comparison — those were never timezone-sensitive. NULL and empty string remain indistinguishable in table row storage (see KNOWN-DIVERGENCES.md) since rows are stored as plain strings; GEOGRAPHY, RANGE and INTERVAL remain out of scope by explicit agreement with the user before this work started"
