capabilities:
  rest.datasets.list:
    status: supported
    fidelity: high
    tests:
      - conformance/foundation/rest_datasets_list
  rest.datasets.get:
    status: supported
    fidelity: medium
    tests:
      - unit/server/datasets_get
  rest.datasets.insert:
    status: supported
    fidelity: medium
    tests:
      - unit/server/datasets_insert
  rest.datasets.delete:
    status: supported
    fidelity: medium
    tests:
      - unit/server/datasets_delete
      - unit/server/dataset_delete_requires_delete_contents_when_tables_exist
    reason: deleting a dataset that still has tables requires explicit deleteContents=true, matching the real BigQuery contract; the cascade removes the tables tracked for that dataset
  rest.datasets.undelete:
    status: supported
    fidelity: low
    tests:
      - unit/server/dataset_undelete_restores_metadata_not_contents
      - unit/server/dataset_undelete_fails_without_tombstone
      - unit/server/dataset_undelete_fails_if_dataset_already_exists
    reason: "LocaQL-only convenience endpoint at /_emulator/datasets/undelete (POST), deliberately outside /bigquery/v2/ since BigQuery's REST API has no public dataset undelete contract; restores friendlyName/location/labels/defaultTableExpirationMs from the most recent delete's tombstone, never table contents"
  rest.datasets.patch:
    status: supported
    fidelity: medium
    tests:
      - unit/server/datasets_patch
      - unit/server/datasets_default_table_expiration_ms_round_trip
      - unit/server/tables_inherits_dataset_default_table_expiration_ms
      - unit/server/tables_expire_and_are_purged_after_expiration_time
      - unit/server/dataset_delete_table_count_excludes_expired_tables
    reason: partial update for friendlyName, location, labels and defaultTableExpirationMs is supported; defaultTableExpirationMs is stored and round-tripped (accepts both string and number input, rendered as a string per the BigQuery int64-as-string convention) and now enforced — every table created without an explicit expirationTime inherits an absolute expiration computed from the dataset's default at creation time via a swappable clock (tableService.now, real time.Now in production, overridable in tests), and any table access (get/list/tabledata/dataset-empty-check) lazily purges an expired table the first time it is touched rather than running a background sweep goroutine. This is a narrowly-scoped clock for table expiration specifically, not the general injectable-clock/observability infrastructure envisioned in the master plan's Fase quince (logging, time travel, sessions still use real wall-clock time directly)
  rest.jobs.query:
    status: partial
    fidelity: high
    tests:
      - unit/server/jobs_sync_query
      - unit/server/jobs_executor_type_and_statistics
      - unit/server/jobs_sync_query_supports_information_schema_parameters_with_real_data
      - unit/server/real_sql_engine_where_projection_and_order_by
      - unit/server/real_sql_engine_group_by_aggregate
      - unit/server/real_sql_engine_join_across_tables
      - unit/server/real_sql_engine_limit
      - unit/server/real_sql_engine_invalid_query_fails_explicitly_instead_of_fabricating_rows
      - unit/server/real_sql_engine_missing_table_fails_explicitly
      - unit/server/referenced_tables_uses_complete_ast
      - unit/server/real_sql_engine_comma_join_materializes_every_table
      - unit/server/query_processed_bytes_measure_sources_not_result
      - unit/server/time_partition_equality_prunes_source_bytes
      - unit/server/partition_pruning_does_not_narrow_or_predicate
      - unit/server/range_partition_equality_scans_whole_bucket
      - unit/server/persistent_dml_never_uses_read_only_partition_pruning
    reason: "Async jobs.insert, sync jobs.query and projects.queries use the real github.com/goccy/googlesqlite GoogleSQL engine. The complete parsed AST is walked for physical table paths, including CTE bodies, nested subqueries and comma joins; a narrow FROM/JOIN fallback is used only when parsing fails so the embedded engine remains authoritative for its final syntax result. Referenced catalog tables are materialized into an isolated database, so filtering, projection, joins, aggregation, ordering and limits use real SQL semantics; invalid SQL and missing tables fail explicitly. DONE results are computed once and cached, and totalBytesProcessed is derived from materialized source rows rather than output rows. Read-only equality predicates proven from the AST can prune a single referenced time/ingestion partition or integer-range bucket before materialization; OR/parameters/functions/ranges/repeated references retain a full scan, and DDL/DML never prunes. Since Sesión 39, supported single-statement DDL/DML also commits atomically to the live catalog; see rest.jobs.query.ddl_dml_persistent. This capability remains partial because cross-project references are rejected, INFORMATION_SCHEMA uses dedicated fixed-schema builders, physical column pruning and a BigQuery-equivalent cost model are absent, totalSlotMs/dry-run estimates remain synthetic, and the embedded analyzer is only runtime-verified on Linux/WSL (native Windows/macOS traps; KNOWN-DIVERGENCES Blocking #3)."
  rest.jobs.query_parameters:
    status: partial
    fidelity: medium
    tests:
      - unit/server/named_query_parameters_bind_real_values
      - unit/server/positional_query_parameters_bind_real_values
      - unit/server/named_query_parameter_mode_inferred_from_parameter_names
      - unit/server/typed_null_query_parameter_binds_real_null
      - unit/server/query_parameter_scalar_type_coverage
      - unit/server/bytes_query_parameter_round_trips_base64
      - unit/server/query_parameter_rejects_unsupported_array_type
      - unit/server/query_parameter_rejects_numeric_type
      - unit/server/query_parameters_work_through_async_jobs_insert
    reason: "New in Sesión 86: BigQuery's queryParameters (jobs.query/jobs.insert configuration.query, parameterMode NAMED or POSITIONAL) were not implemented at all before this — any query text containing `@name`/`?` placeholders would either fail unbound in the analyzer or (worse) execute without them, since the request body's queryParameters field was silently dropped (no strict/unknown-field JSON decoding anywhere in this server). Now real: parameters are parsed from the request, stored on the jobRecord as plain strings (same reasoning as every table cell in this project — see storedQueryParameter in query_parameters.go — so they round-trip through job persistence without a Go `any` field changing shape across JSON marshal/unmarshal), and bound into the query at execution time via Go's standard database/sql mechanism (sql.Named(name, value) for NAMED mode, positional args for POSITIONAL), verified empirically against the real engine before building on it (a disposable spike, deleted after use): `?`/`@name` binding both work natively, a bound Go value's own type (int64/float64/bool/[]byte/string) is what the analyzer infers the GoogleSQL type from, and — a real, driver-crashing gotcha found and avoided — passing a *typed* nil pointer (e.g. a nil *int64) panics the driver, so a NULL parameter value is always bound as a plain untyped nil. Supported scalar parameterType values: STRING, INT64, FLOAT64, BOOL, BYTES (base64-decoded per BigQuery's own wire convention), DATE, DATETIME, TIME, TIMESTAMP — including a genuinely NULL value for any of them (bare sql.Named(name, nil) verified to bind correctly, including in a real WHERE-clause comparison against a real column, where the context supplies the type). Marked partial, not supported: ARRAY and STRUCT parameterType are rejected explicitly with a clear 400 (not silently mishandled) — out of scope for this increment, same category of complexity as nested schema handling elsewhere in this project; NUMERIC and BIGNUMERIC are also rejected explicitly, for a different, verified reason — an untyped bind value's own Go type is all the analyzer has to infer from, and a Go string parameter (there is no native Go decimal type) always infers as STRING rather than NUMERIC/BIGNUMERIC in an arithmetic or comparison context (confirmed empirically: `CAST(@a AS NUMERIC)` would fix it, but rewriting arbitrary client SQL text to inject a CAST around every parameter reference would require actually parsing the client's SQL, which this project deliberately avoids). A completely context-free NULL parameter with no surrounding comparison/arithmetic to infer a type from (e.g. a bare `SELECT @a AS x`) defaults to INT64 in the result schema — the same default-typing behavior already documented for a bare `?` inside a hand-built ARRAY/STRUCT literal elsewhere in this codebase, not a new kind of gap. Script jobs (multi-statement, isScript=true) do not thread queryParameters to their per-statement child jobs in this increment — a narrower, explicit scope boundary, not an oversight"
  rest.jobs.query.ddl_dml_persistent:
    status: partial
    fidelity: high
    tests:
      - unit/server/persistent_dml_mutates_catalog
      - unit/server/persistent_create_table_as_select_and_drop
      - unit/server/persistent_dml_failure_is_atomic
      - unit/server/unsupported_mutating_statements_fail_explicitly
      - unit/server/persistent_merge_truncate_and_parameters
      - unit/server/persistent_create_table_schema_and_replace
      - unit/server/persistent_dml_job_statistics_and_resource_lock
      - unit/server/polling_pending_dml_does_not_execute_it_early_or_twice
      - official/python/google_cloud_bigquery_persistent_ddl_dml
    reason: "New in Sesión 39: single-statement INSERT, UPDATE, DELETE, MERGE, TRUNCATE TABLE, CREATE TABLE, CTAS, CREATE OR REPLACE TABLE and DROP TABLE execute through the real GoogleSQL engine and persist into LocaQL's catalog. The target table is automatically attached to the job's project:dataset.table resource lock and storage-write backpressure limiter. The statement runs against an isolated materialized database; only after SQL execution, final-schema/REQUIRED validation and a catalog version compare-and-swap succeed is the final table image committed, so analyzer failures are atomic and concurrent REST writes cannot be silently lost. Polling PENDING/RUNNING DML never executes it early or twice. statistics.query exposes statementType and numDmlAffectedRows; INSERT/UPDATE/DELETE also expose an exact dmlStats category, while MERGE omits a fabricated category split the driver cannot report. Query responses expose numDmlAffectedRows; pinned google-cloud-bigquery 3.42.3 verifies SDK-visible counts and persisted INSERT/UPDATE/MERGE/DELETE/CTAS/DROP. Leading dbt-style comments, same-project quoted project.dataset.table targets and named/positional parameters are supported. Partial because cross-project targets, ALTER/procedural SQL, DML against views/external tables, persistent DDL/DML inside an open session transaction and atomic persistent multi-statement scripts are rejected explicitly or remain unimplemented."
  rest.jobs.sessions:
    status: supported
    fidelity: medium
    tests:
      - unit/server/sync_query_create_session_returns_session_info
      - unit/server/session_temp_table_persists_across_separate_sync_queries
      - unit/server/session_unknown_session_id_fails_explicitly
      - unit/server/session_transaction_commit_persists_temp_table_changes
      - unit/server/session_transaction_rollback_discards_temp_table_changes
      - unit/server/session_rollback_without_active_transaction_fails_explicitly
      - unit/server/session_idle_timeout_expires_session
      - unit/server/async_single_statement_with_trailing_semicolon_is_not_treated_as_script
      - unit/server/async_genuine_multi_statement_script_still_treated_as_script
    reason: "jobs.query/jobs.insert support createSession and connectionProperties session_id, with lazy idle expiry and sessionInfo responses. Because the embedded engine cannot retain native TEMP TABLE registration and cannot execute ROLLBACK reliably, LocaQL owns a session temp-table catalog and snapshots it for real BEGIN/COMMIT/ROLLBACK semantics. CREATE TEMP TABLE name AS SELECT and qualified _SESSION.table reads are supported. Persistent base-table DDL/DML works outside a transaction as of Sesión 39, but is rejected explicitly while a session transaction is open because transaction rollback only governs temp tables. Bare temp-table resolution, separate CREATE TEMP plus INSERT, and atomic persistent multi-statement transactions remain out of scope. INFORMATION_SCHEMA.SESSIONS_BY_USER is implemented; SESSIONS_BY_PROJECT does not exist in real BigQuery either."
  rest.datasets.list.pagination:
    status: supported
    fidelity: medium
    tests:
      - conformance/pagination/rest_datasets_list_pagination
  rest.tables.list.pagination:
    status: supported
