      - unit/server/date_datetime_time_timestamp_round_trip_through_tabledata_unchanged
      - unit/server/date_column_to_column_comparison_works_correctly
      - unit/server/known_upstream_bug_date_string_literal_parsing_is_off_by_one_day
    reason: "NUMERIC and BIGNUMERIC (Sesión 77) are now real column types in the query engine (added to realSQLScalarTypes) rather than falling back to STRING: exact decimal precision is preserved end to end (verified with a 38-digit BIGNUMERIC value round-tripping unchanged) and real decimal arithmetic works (0.1 + 0.2 = exactly 0.3 through the engine, unlike FLOAT64's binary rounding error). DATE/DATETIME/TIME/TIMESTAMP were already accepted; verified they round-trip unchanged through tabledata.list (never touches the query engine for a plain table) and that comparing two real DATE columns to each other works correctly through the engine. **Known upstream bug, not a LocaQL defect and not workaroundable from LocaQL's side:** constructing a DATE value from a string inside query text — either `DATE 'YYYY-MM-DD'` literal syntax or `CAST('YYYY-MM-DD' AS DATE)` — silently produces a date exactly one calendar day earlier than the string says, verified with multiple distinct dates (including a leap-year boundary) and pinned by a dedicated test documenting the exact wrong value, so a future googlesqlite fix surfaces as a test failure rather than silently going stale. Confirmed NOT to affect DATETIME/TIMESTAMP/TIME literals, CURRENT_DATE(), DATE(<timestamp>) extraction, or DATE column-to-column comparison — only constructing a DATE from a literal string. No known upstream issue filed for this yet. NULL and empty string remain indistinguishable in table row storage (see KNOWN-DIVERGENCES.md) since rows are stored as plain strings; GEOGRAPHY, RANGE and INTERVAL remain out of scope by explicit agreement with the user before this work started"
  sql.information_schema.priority:
    status: partial
    fidelity: medium
    tests:
      - unit/server/information_schema_priority_tables_columns
