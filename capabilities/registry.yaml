  grpc.storage.read:
    status: partial
    fidelity: medium
    tests:
      - unit/server/storage_read_session_and_read_rows_round_trip
      - unit/server/storage_read_session_applies_column_projection
      - unit/server/storage_read_session_applies_row_restriction
      - unit/server/storage_read_session_table_not_found_returns_not_found
      - unit/server/storage_read_session_rejects_arrow_format
      - unit/server/storage_read_rows_unknown_stream_returns_not_found
      - unit/server/storage_split_read_stream_is_unimplemented
      - unit/server/storage_read_session_rejects_nested_schema
    reason: "New in Sesión 81, the bounded first increment of BigQuery Storage API emulation (real Google-generated stubs from cloud.google.com/go/bigquery/storage/apiv1/storagepb, registered on a separate plaintext gRPC listener — --storage-grpc-addr, default :9060 — no TLS/auth, matching how Google's own Firestore/Pub/Sub/Bigtable emulators expose local gRPC and this emulator's permanent anonymous-only design). CreateReadSession and ReadRows are real: column projection (TableReadOptions.selected_fields) and the row_restriction push-down filter are rendered as a genuine SELECT ... WHERE ... executed through the same real GoogleSQL engine every other query in this project uses (internal/server/sql_engine.go), not a hand-rolled filter interpreter — so WHERE semantics are exactly as correct as the rest of this project's query support. Rows are Avro-framed (AvroRows.SerializedBinaryRows, real raw binary encoding via goavro, reusing buildAvroSchemaJSON/stringToAvroValue already used by Load/Extract), matching the real API's message shape. Verified end-to-end over the real wire protocol, not just direct Go calls: tests dial a real grpc.ClientConn (in-memory bufconn listener) and exercise the actual generated client stub. Deliberately bounded, not the full Storage API surface: every session returns exactly 1 stream regardless of max_stream_count/preferred_min_stream_count, and SplitReadStream returns an explicit Unimplemented status rather than a fabricated split — multi-stream partitioning was scoped out upfront with the user. Arrow framing (ReadSession_TableReadOptions_ArrowSerializationOptions) is rejected with an explicit Unimplemented status rather than silently ignored or producing wrong bytes — Avro only. A table with a RECORD/REPEATED field is rejected explicitly (reusing rejectNestedFields, the same convention already used by CSV/AVRO/PARQUET load/extract) rather than producing corrupt Avro. The 6-hour session auto-expiry real BigQuery documents is not modeled (sessions never expire here). See grpc.storage.write (Sesión 82) for the separate Storage Write API"
  grpc.storage.write:
    status: partial
    fidelity: medium
    tests:
      - unit/server/storage_write_default_stream_appends_rows_immediately
      - unit/server/storage_write_committed_stream_offset_tracking
      - unit/server/storage_write_pending_stream_buffered_until_commit
      - unit/server/storage_write_batch_commit_rejects_non_finalized_stream
      - unit/server/storage_write_get_write_stream_returns_schema
      - unit/server/storage_write_flush_rows_is_unimplemented
      - unit/server/storage_write_create_write_stream_rejects_buffered
      - unit/server/storage_write_create_write_stream_rejects_nested_schema
      - unit/server/storage_write_append_rows_rejects_repeated_proto_field
    reason: "New in Sesión 82, on the same gRPC listener as grpc.storage.read (google.cloud.bigquery.storage.v1.BigQueryWrite, real Google-generated stubs). CreateWriteStream, AppendRows (bidi-streaming), GetWriteStream, FinalizeWriteStream and BatchCommitWriteStreams are all real. Rows arrive protobuf-encoded (ProtoSchema.proto_descriptor + ProtoRows.serialized_rows — the Write API's own wire format is protobuf, never Avro/Arrow, unlike the Read side): each row's schema descriptor is wrapped in a synthetic, self-contained FileDescriptorProto and resolved into a real protoreflect.MessageDescriptor via protodesc.NewFile, then every serialized row is decoded through google.golang.org/protobuf/types/dynamicpb (real runtime protobuf reflection, no generated Go struct needed) and matched to the destination table's columns by field name. The '_default' stream (COMMITTED, implicit, no CreateWriteStream needed) and explicit COMMITTED streams append straight into the real catalog via the same upsertCopyDestination helper copy jobs already use (WRITE_APPEND + CREATE_NEVER — Storage Write never creates a table, matching real BigQuery); explicit PENDING streams buffer rows in server memory until BatchCommitWriteStreams applies every named, finalized stream's buffer to the catalog in one call — genuinely atomic, not just sequential. Real offset-based exactly-once semantics for explicit streams: an AppendRowsRequest.offset behind the stream's current end returns ALREADY_EXISTS, ahead of it returns OUT_OF_RANGE, embedded in the per-request AppendRowsResponse (not a top-level RPC error), matching the real API's retry contract. Verified end-to-end over the real wire protocol: unit tests dial a real grpc.ClientConn (bufconn) and drive the actual generated client stub through full CreateWriteStream/AppendRows/FinalizeWriteStream/BatchCommitWriteStreams sequences; additionally smoke-tested over a real TCP network connection (a disposable throwaway client, deleted after use) against a real running locaql binary, confirming genuine wire-protocol interoperability beyond the in-memory test harness. Deliberately bounded: BUFFERED streams and FlushRows return an explicit Unimplemented status (BUFFERED is rejected at CreateWriteStream, so FlushRows never has a valid target); a proto field that is repeated or a nested message is rejected per-row via RowErrors rather than silently dropped or corrupted (same RECORD/REPEATED scope boundary as rejectNestedFields elsewhere); a table with a RECORD/REPEATED destination schema field is rejected explicitly at CreateWriteStream/the default stream's first append. missing_value_interpretations and schema-update-mid-stream (UpdatedSchema) are not implemented"
