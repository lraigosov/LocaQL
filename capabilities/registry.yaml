  emulator.observability:
    status: partial
    fidelity: medium
    tests:
      - unit/server/metrics_endpoint_reports_request_counts
      - unit/server/metrics_latency_buckets_sum_to_request_total
      - unit/server/metrics_reflects_active_session_count
      - unit/server/jobs_metrics_distinguishes_completed_and_failed
    reason: "New in Sesión 80: every request is now wrapped by a real HTTP middleware (internal/server/observability.go:withObservability) that records metrics and emits structured (log/slog, JSON) request logs — successful requests at Debug (silent by default, matching the pre-existing quiet test/CLI output), 4xx at Warn, 5xx at Error, so problems surface without a verbose flag. GET /_emulator/metrics exposes a JSON snapshot: request totals by status class and by route group (emulator/bigquery/storage/storage_upload/other), a fixed-bucket request-latency histogram, and job metrics (submittedTotal/completedTotal/failedTotal, plus a live occupancy/capacity gauge for every concurrency limiter already in the job-run path — runSlots/storageWriteSlots/resourceSlots — computed directly from each buffered channel's len/cap, no new bookkeeping needed). Deliberately plain JSON, not Prometheus text exposition format: consistent with the rest of this REST API and zero new dependencies, but not directly scrapeable by a real Prometheus/Grafana without an intermediate exporter — a real, documented limitation, not an oversight. There is no retry mechanism anywhere in this codebase (a failed job is never automatically re-run), so no retry counter is reported rather than fabricating one that would always read zero. Marked partial rather than supported: this is the 'minimal metrics/traces' half of the master plan's Fase quince observability vision, not the full wishlist — no distributed tracing (REST→service→SQL→SQLite spans), no OpenTelemetry export, no slow-query log, no fault-injection endpoint, no sensitive-data log redaction policy. See emulator.diagnostics (Sesión 83) for the separate guided-troubleshooting endpoint"
  emulator.diagnostics:
    status: partial
    fidelity: medium
    tests:
      - unit/server/diagnostics_reports_recent_job_failures
      - unit/server/diagnostics_reports_persistence_status
      - unit/server/diagnostics_reports_resource_locks_shape
      - unit/server/diagnostics_reports_active_session_count
      - unit/server/diagnostics_reports_set_environment_variables_only
    reason: "New in Sesión 83, the 'troubleshooting guiado' half of the master plan's §42.10 observability/release Nivel C item (the other half, release reproducible, is a separate, not-yet-started front). GET /_emulator/diagnostics aggregates real, already-live state into one 'why is this broken' view, distinct from /_emulator/metrics' raw counters: (1) persistence write health — every persistLocked() call site already discarded its returned error prior to this session, so a full disk or a permissions problem failed completely silently forever; persistLocked is now wrapped to record the last failure (jobService.lastPersistError/lastPersistErrorAt), surfaced here rather than fixed at every call site (fixing every call site to react differently would be a much larger, riskier change to the existing job-run control flow for no behavioral benefit — this only makes an existing silent failure observable). (2) recentJobFailures: the actual failed jobs behind a failedTotal count (project/job id/type/reason/message/end time, newest first, capped at 20) — 'which job failed and why', not just 'how many'. (3) resourceLocks.held: the specific resource keys (project:dataset.table) currently locked, not just a count — 'which table is contended', the actually-guided part of diagnosing a mutation that appears to hang. (4) sessions.active (reused from emulator.observability). (5) environment: every LOCAQL_* environment variable that changes behavior, read at request time (not cached at startup) and included only when actually set — an unset one is silently using its documented default, and listing it as empty would misleadingly suggest it was explicitly configured to nothing. Marked partial: this is real, aggregated data from the live catalog, not a fabricated health score, but it does not audit dataset/table/routine/model catalog counts (a separate, larger feature), does not report whether the Storage API gRPC listener is actually reachable (that listener lives in a separate process concern — cmd/locaql/main.go — with no shared state back into internal/server today), and has no fault-injection capability"
  emulator.version:
    status: supported
    fidelity: high
    tests:
      - conformance/foundation/emulator_version
  emulator.release.reproducible_build:
    status: supported
    fidelity: medium
    reason: "The 'release reproducible' half of the master plan's §42.10 Nivel C item (the other half, guided troubleshooting, shipped in Sesión 83 as emulator.diagnostics). internal/version.Version/Commit/BuildDate changed from const to var (internal/version/version.go) so a build can inject real values via -ldflags -X, while a plain go build/go run with no ldflags still reports the exact same defaults (0.1.0-dev/none/unknown) as before this existed — a zero-behavior-change default. GET /_emulator/version (see emulator.version) now also surfaces commit and buildDate. A new Makefile drives it: `make build` cross-compiles both locaql and locaql-ui for the host platform into dist/ with CGO_ENABLED=0 and the version vars injected from `git describe`/`git rev-parse`/`date` (overridable via VERSION/COMMIT/BUILD_DATE); `make build-all` repeats this for a 5-platform matrix (linux/amd64, linux/arm64, windows/amd64, darwin/amd64, darwin/arm64). A new multi-stage Dockerfile (golang:1.25 builder → gcr.io/distroless/static-debian12:nonroot) builds only locaql (not locaql-ui, which is a separate local dev-console process, not meant to run in a minimal server container) as a static, non-root image exposing :9050 (REST) and :9060 (Storage gRPC), bundling capabilities/registry.yaml at /etc/locaql/capabilities/registry.yaml since a standalone binary run outside the repo root has no relative path to it otherwise. Deliberately no automated go test covers this: a Makefile/Dockerfile is infra invoked by a real toolchain (make, docker), not something `go test` executes, so this was instead verified the same way the project's own rigor standard already treats build tooling — empirically, by actually running it: `make build` produced genuine static, cgo-free dist/locaql and dist/locaql-ui binaries (confirmed with `file`) whose live GET /_emulator/version reflected the injected VERSION/COMMIT/BUILD_DATE; `make docker-build` produced a working locaql:<version> / locaql:latest image (after an unrelated, environment-local Docker Desktop WSL Integration gap for the Ubuntu-24.04 distro was fixed) and a container run from it (docker run -d, health/version curled through published ports, docker logs checked) answered GET /_emulator/health with status ok and GET /_emulator/version with the same injected values, over both its REST and gRPC listeners. New CHANGELOG.md documents the 'How releases are cut' process (bump Unreleased→dated section, git tag, make build-all/make docker-build read VERSION from git describe automatically). **Extended in a later session: releasing is now automated end-to-end.** Pushing a `vX.Y.Z` tag triggers `.github/workflows/release.yml`, which validates (build/vet/test/-race) then, in parallel, (a) builds and pushes a real multi-arch (`linux/amd64`+`linux/arm64`) image to `ghcr.io/lraigosov/locaql` tagged `X.Y.Z`/`X.Y`/`latest` via `docker/build-push-action`, and (b) runs `make build-all`+`make sbom` and publishes a GitHub Release for the tag with every platform archive and the SBOM attached via `gh release create`. The Dockerfile itself needed a real fix for true multi-arch support: it previously hardcoded `GOOS=linux` with no `GOARCH` at all (always building for the host's native arch regardless of target), missing Docker's automatic `TARGETOS`/`TARGETARCH` build args entirely; fixed by consuming those args and pinning the builder stage to `--platform=$BUILDPLATFORM` (so Go's own cross-compiler produces the target arch's binary without needing QEMU to emulate the compile itself — only the final distroless base layer needs pulling for the real target arch). Verified empirically with a real `docker buildx build --platform linux/amd64,linux/arm64` (not assumed): both architectures compiled and exported into a real manifest list, and a container run from the resulting image answered `GET /_emulator/health`/`GET /_emulator/version` correctly with the exact injected build metadata; `make docker-build` (the pre-existing single-arch classic target, no explicit buildx) was re-verified unaffected by the change (modern Docker Engine's BuildKit populates `TARGETOS`/`TARGETARCH` automatically even for a plain `docker build`). **Extended in a later session: the published image now ships the full solution, not just the emulator.** The 'locaql-ui isn't meant to run in a minimal server container' framing above turned out to be a real, undocumented gap once a first real GHCR image existed to check against — `docker run` on the published image gave API-only access with no way to reach the console. Fixed with a new third binary, `cmd/locaql-supervisor` (the image's actual `ENTRYPOINT` now), which execs `locaql` and `locaql-ui` as two real subprocesses of one container with no shell involved anywhere (distroless/static has none) — SIGTERM is forwarded to both on shutdown via `exec.Cmd.Cancel`, and if either child exits unexpectedly the other is torn down too and the container exits non-zero, so it never looks 'up' with half its processes silently dead. Verified empirically, not just by code review: a real `docker build` + `docker run` answered `GET /_emulator/health` on :9050 directly and through the console's own :9070→:9050 proxy, `docker top` showed all three processes (supervisor, locaql, locaql-ui) running as the nonroot UID, and `docker stop` exited cleanly (exit code 0, under a second, well inside the 5s grace period) by correctly distinguishing a requested shutdown from an actual crash"
